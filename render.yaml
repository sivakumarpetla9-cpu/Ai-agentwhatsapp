services:
  # WhatsApp Dine-In Platform Backend Web Service
  - type: web
    name: whatsapp-restaurant-backend
    env: docker
    plan: free
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_MODE
        value: meta
      - key: WHATSAPP_API_VERSION
        value: v21.0
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_WEBHOOK_VERIFY_SIGNATURE
        value: "true"
      - key: WHATSAPP_REQUEST_TIMEOUT
        value: "10.0"

